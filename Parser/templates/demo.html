<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Spy Chatbot - Embed Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 24px;
            max-width: 600px;
        }

        .demo-header h1 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 8px;
        }

        .demo-header p {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .embed-frame {
            width: 100%;
            max-width: 500px;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .embed-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .demo-snippet {
            margin-top: 24px;
            max-width: 500px;
            width: 100%;
        }

        .demo-snippet summary {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
        }

        .demo-snippet pre {
            margin-top: 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85em;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="demo-header">
        <h1>LIGO AI Assistant</h1>
        <p>Gravity Spy &mdash; Embed Demo</p>
    </div>

    <div class="embed-frame">
        <iframe src="/embed" title="LIGO AI Assistant"></iframe>
    </div>

    <div class="demo-snippet">
        <details>
            <summary>Embed code</summary>
            <pre>&lt;iframe
  src="https://your-domain.example/embed"
  width="400"
  height="600"
  style="border: none; border-radius: 12px;"
  title="LIGO AI Assistant"
&gt;&lt;/iframe&gt;</pre>
        </details>
    </div>
</body>
</html>
