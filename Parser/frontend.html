<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Spy - Document Search & Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }


        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Chat Interface */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }

        .sources {
            margin-top: 10px;
            font-size: 0.85em;
            color: #666;
        }

        .sources a {
            color: #667eea;
            text-decoration: none;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }


        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-indicator.online {
            background: #4caf50;
        }

        .status-indicator.offline {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LIGO AI Assistant</h1>
            <p>Gravity Spy</p>
            <div style="margin-top: 10px; font-size: 0.9em;">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Checking connection...</span>
            </div>
        </div>

        <!-- Chat Interface -->
        <div id="chatTab" class="tab-content active">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-bubble">
                        👋 Hello! I'm your LIGO assistant. Ask me anything!
                    </div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Ask a question about LIGO..." onkeypress="handleChatKeyPress(event)">
                <button onclick="sendChatMessage()" id="chatButton">Send</button>
            </div>
        </div>

    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';
        
        // Check API status on load
        checkStatus();


        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/health`);
                const data = await response.json();
                
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                
                if (data.status === 'ok') {
                    indicator.className = 'status-indicator online';
                    statusText.textContent = `Connected (${data.total_chunks} chunks)`;
                } else {
                    indicator.className = 'status-indicator offline';
                    statusText.textContent = 'Disconnected';
                }
            } catch (error) {
                document.getElementById('statusIndicator').className = 'status-indicator offline';
                document.getElementById('statusText').textContent = 'Cannot connect to API';
            }
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }


        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const button = document.getElementById('chatButton');
            const messagesDiv = document.getElementById('chatMessages');
            const query = input.value.trim();

            if (!query) return;

            // Disable input
            input.disabled = true;
            button.disabled = true;

            // Add user message
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.innerHTML = `<div class="message-bubble">${query}</div>`;
            messagesDiv.appendChild(userMessage);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Clear input
            input.value = '';

            // Add loading message
            const loadingMessage = document.createElement('div');
            loadingMessage.className = 'message assistant';
            loadingMessage.id = 'loadingMessage';
            loadingMessage.innerHTML = '<div class="message-bubble">Thinking...</div>';
            messagesDiv.appendChild(loadingMessage);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        top_k: 5,
                        use_rag: true
                    })
                });

                const data = await response.json();

                // Remove loading message
                loadingMessage.remove();

                // Add assistant response
                const assistantMessage = document.createElement('div');
                assistantMessage.className = 'message assistant';
                
                let sourcesHtml = '';
                if (data.sources && data.sources.length > 0) {
                    sourcesHtml = '<div class="sources"><strong>Sources:</strong> ';
                    sourcesHtml += data.sources.map((source, idx) => 
                        `${source.filename} (Page ${source.page_numbers.join(', ')})`
                    ).join(', ');
                    sourcesHtml += '</div>';
                }

                assistantMessage.innerHTML = `
                    <div class="message-bubble">${data.answer}</div>
                    ${sourcesHtml}
                `;
                messagesDiv.appendChild(assistantMessage);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

            } catch (error) {
                loadingMessage.remove();
                const errorMessage = document.createElement('div');
                errorMessage.className = 'message assistant';
                errorMessage.innerHTML = `<div class="message-bubble error">Error: ${error.message}</div>`;
                messagesDiv.appendChild(errorMessage);
            } finally {
                input.disabled = false;
                button.disabled = false;
                input.focus();
            }
        }


        // Check status every 30 seconds
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
